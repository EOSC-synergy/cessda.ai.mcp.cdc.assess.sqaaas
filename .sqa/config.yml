config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/cessda.ai.mcp.cdc:
      branch: main
      repo: https://github.com/cessda/cessda.ai.mcp.cdc
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/cessda.ai.mcp.cdc git:
        commands:
        - /usr/bin/env sh .sqa/script.yellow_innocent_nighthawk.sh
        container: qc.acc_cardamom_supportive_baboon
  QC.Doc:
    repos:
      github.com/cessda/cessda.ai.mcp.cdc find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.saffron_dreamy_chimpanzee.sh
        container: qc.doc_marigold_respectful_hippopotamus
      github.com/cessda/cessda.ai.mcp.cdc git:
        commands:
        - /usr/bin/env sh .sqa/script.fandango_loving_giraffe.sh
        container: qc.doc_polar_spirited_kirin
      github.com/cessda/cessda.ai.mcp.cdc markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ice_exuberant_hornbill.sh
        container: qc.doc_cloud_open_porpoise
  QC.Lic:
    repos:
      github.com/cessda/cessda.ai.mcp.cdc licensee:
        commands:
        - /usr/bin/env sh .sqa/script.olive_decisive_raccoon.sh
        container: qc.lic_paprika_diplomatic_platypus
  QC.Sec:
    repos:
      github.com/cessda/cessda.ai.mcp.cdc bandit:
        commands:
        - /usr/bin/env sh .sqa/script.poppy_stoic_buffalo.sh
        container: qc.sec_ceru_honest_spider
  QC.Sty:
    repos:
      github.com/cessda/cessda.ai.mcp.cdc flake8:
        commands:
        - /usr/bin/env sh .sqa/script.silver_smart_tapir.sh
        container: qc.sty_indigo_philosophical_chinchilla
      github.com/cessda/cessda.ai.mcp.cdc hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.paprika_lucky_mink.sh
        container: qc.sty_wheat_stubborn_hornbill
  QC.Uni:
    repos:
      github.com/cessda/cessda.ai.mcp.cdc pytest:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_careful_badger.sh
        container: qc.uni_brown_nurturing_camel
  QC.Ver:
    repos:
      github.com/cessda/cessda.ai.mcp.cdc get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.paprika_vibrant_buffalo.sh
        container: qc.ver_grape_dizzy_turtle
timeout: 5400
